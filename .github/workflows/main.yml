name: ESP32-C5 CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build with ESP‑IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "latest"   # or a specific tag like v5.5
          target: "esp32c5"
          path: "."
